version: '3.4'
services:
  alfresco-share:
    image: alfresco-share-alfresco:development
    build:
      dockerfile: ./Dockerfile
      context: ../alfresco-share-docker/target
    environment:
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
      REPO_HOST: alfresco-acs
      REPO_PORT: 8080
    ports:
      - "${SHARE_PORT:-8180}:8080"
      - "${SHARE_DEBUG_PORT:-9898}:8888"
  alfresco-acs:
    image: alfresco-content-services-alfresco:development
    build:
      dockerfile: ./Dockerfile
      context: ../alfresco-platform-docker/target
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=AES/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=AES
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=${METADATA_KEYSTORE_PASSWORD}
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=${METADATA_KEYSTORE_METADATA_PASSWORD}
        -Dmetadata-keystore.metadata.algorithm=AES
      JAVA_OPTS: "
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dmessaging.broker.url=\"failover:(nio://alfresco-activemq:61616)?timeout=3000&jms.useCompression=true\"
        -Ddb.username=${POSTGRES_USER}
        -Ddb.password=${POSTGRES_PASSWORD}
        -Ddb.url=jdbc:postgresql://alfresco-postgres:5432/${POSTGRES_DB}
        "
      CATALINA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=0.0.0.0:8888"
    ports:
      - "${ACS_PORT:-8080}:8080"
      - "${ACS_DEBUG_PORT:-8888}:8888"
    volumes:
      - alfresco-acs-volume:/usr/local/tomcat/alf_data
    depends_on:
      - alfresco-postgres
  alfresco-postgres:
    image: postgres:16.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: postgres -c max_connections=300 -c log_min_messages=LOG
    ports:
      - "${POSTGRES_PORT:-5555}:5432"
    volumes:
      - alfresco-db-volume:/var/lib/postgresql/data
  alfresco-ass:
    image: alfresco/alfresco-search-services:2.0.15
    environment:
      SOLR_ALFRESCO_HOST: alfresco-acs
      SOLR_ALFRESCO_PORT: 8080
      SOLR_SOLR_HOST: alfresco-ass
      SOLR_SOLR_PORT: 8983
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco,archive
      ALFRESCO_SECURE_COMMS: "secret"
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms.secret=secret"
    ports:
      - "8983:8983"
    volumes:
      - alfresco-ass-volume:/opt/alfresco-search-services/contentstore
      - alfresco-ass-volume:/opt/alfresco-search-services/data
  alfresco-activemq:
      image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8
      mem_limit: 1g
      ports:
        - 8161:8161 # Web Console
        - 5672:5672 # AMQP
        - 61616:61616 # OpenWire
        - 61613:61613 # STOMP

volumes:
  alfresco-acs-volume:
  alfresco-db-volume:
  alfresco-ass-volume:
